plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.11-SNAPSHOT" apply false
    id "org.jetbrains.changelog" version "2.0.0"
    id "io.github.pacifistmc.forgix" version "2.0.0-SNAPSHOT.5.1"
}

architectury {
    minecraft = rootProject.minecraft_version
}

forgix {
  autoRun = true
}

changelog {
    repositoryUrl = rootProject.repository_url
    introduction = """
    Changelog to track updates for this mod.
    Add your changes to Unreleased if you want to commit.
    Please write according to [Keep a Changelog](https://keepachangelog.com/en/1.0.0/)
    """
    combinePreReleases = false
}

subprojects {
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
            minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
            mappings loom.layered() {
                officialMojangMappings()
                parchment("org.parchmentmc.data:parchment-${rootProject.minecraft_version}:2023.09.03@zip")
            }
        }
}


allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    version = rootProject.mod_version

    repositories {
        maven {
            url = "https://codeberg.org/api/packages/Mod-Sauce/maven"
        }
        maven {
          url =  "https://maven.parchmentmc.org"
        }
        maven {
            url = "https://maven.felnull.dev"
        }
        maven {
            url = "https://m2.dv8tion.net/releases"
        }
        maven {
        url = "https://plugins.gradle.org/m2/"
        }
        maven {
            url = "https://jitpack.io"
        }
        maven {
            url = "https://maven.blamejared.com"
        }
        maven {
            url = "https://api.modrinth.com/maven"
        }
        maven {
            url = "https://maven.lavalink.dev/releases"
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 17
    }

    java {
        withSourcesJar()
    }
}
