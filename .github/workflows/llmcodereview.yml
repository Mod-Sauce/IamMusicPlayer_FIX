name: Gemini Code Report

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  gemini-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install @google/generative-ai simple-git

      - name: Run Gemini analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node <<'EOF'
          (async () => {
            const { GoogleGenerativeAI } = await import("@google/generative-ai");
            const simpleGit = (await import("simple-git")).default;
            const fs = await import("fs");

            const git = simpleGit();
            const diff = await git.diff(["HEAD~1"]);

            const genAI = new GoogleGenerativeAI(process.env.GEMINI_API_KEY);
            const model = genAI.getGenerativeModel({ model: "gemini-3-flash" });

            const prompt = `You are a code review expert. Analyze the following git diff and provide a detailed but concise code review.

            Keep it SHORT and SIMPLE. Be brief and direct.

            Focus on:
            - Potential bugs or logical errors in the NEW code
            - Performance issues and optimization opportunities
            - Security vulnerabilities
            - Code style and maintainability improvements
            - Edge cases that might not be handled
            - If the old code had a better approach to solving the same problem, mention it

            Be constructive and specific but keep explanations SHORT. For each issue:
              1. What the problem is (1-2 sentences)
              2. Why it matters (1 sentence)
              3. How to fix it (code example or brief explanation)

            Return the review in clean, well-formatted markdown with sections and code blocks.
            Keep the total response under 1000 words.

            Git Diff:
            ${diff}`;

            const result = await model.generateContent(prompt);
            const report = result.response.text();
            
            const escapeHtml = (text) => {
              const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
              };
              return text.replace(/[&<>"']/g, m => map[m]);
            };
            
            const markdownToHtml = (md) => {
              const codeBlocks = [];
              const inlineCode = [];
              
              // Extract code blocks FIRST - don't escape them yet
              let html = md.replace(/```[\s\S]*?```/g, (match) => {
                const code = match.substring(3, match.length - 3).trim();
                codeBlocks.push(code);
                return 'XYZCODEBLOCX' + (codeBlocks.length - 1) + 'XYZCODEBLOCX';
              });
              
              // Extract inline code
              html = html.replace(/`[^`]+`/g, (match) => {
                const code = match.substring(1, match.length - 1);
                inlineCode.push(code);
                return 'XYZINLINEX' + (inlineCode.length - 1) + 'XYZINLINEX';
              });
              
              // NOW escape the remaining HTML
              html = escapeHtml(html);
              
              // Headers
              html = html.replace(/^##### (.*?)$/gm, '<h5>$1</h5>');
              html = html.replace(/^#### (.*?)$/gm, '<h4>$1</h4>');
              html = html.replace(/^### (.*?)$/gm, '<h3>$1</h3>');
              html = html.replace(/^## (.*?)$/gm, '<h2>$1</h2>');
              html = html.replace(/^# (.*?)$/gm, '<h1>$1</h1>');
              
              // Bold only
              html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
              html = html.replace(/__(.*?)__/g, '<strong>$1</strong>');
              
              // Lists
              html = html.replace(/^- (.*?)$/gm, '<li>$1</li>');
              html = html.replace(/^(\d+)\. (.*?)$/gm, '<li>$2</li>');
              html = html.replace(/(<li>.*?<\/li>)/s, (match) => {
                return '<ul>' + match + '</ul>';
              });
              
              // Paragraphs
              html = html.replace(/\n\n+/g, '</p><p>');
              html = html.replace(/\n(?!<)/g, '<br>');
              html = '<p>' + html + '</p>';
              
              // Clean up nested tags
              html = html.replace(/<p>(<h[1-6]>)/g, '$1');
              html = html.replace(/(<\/h[1-6]>)<\/p>/g, '$1');
              html = html.replace(/<p>(<ul>)/g, '$1');
              html = html.replace(/(<\/ul>)<\/p>/g, '$1');
              html = html.replace(/<p>XYZCODEBLOCX/g, 'XYZCODEBLOCX');
              html = html.replace(/XYZCODEBLOCX<\/p>/g, 'XYZCODEBLOCX');
              html = html.replace(/<p><\/p>/g, '');
              
              // Restore inline code
              for (let i = 0; i < inlineCode.length; i++) {
                html = html.split('XYZINLINEX' + i + 'XYZINLINEX').join('<code>' + escapeHtml(inlineCode[i]) + '</code>');
              }
              
              // Restore code blocks
              for (let i = 0; i < codeBlocks.length; i++) {
                html = html.split('XYZCODEBLOCX' + i + 'XYZCODEBLOCX').join('<pre><code>' + escapeHtml(codeBlocks[i]) + '</code></pre>');
              }
              
              return html;
            };

            const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
            const reportName = "report-" + timestamp + ".html";
            const date = new Date();

            const html = '<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gemini Code Review</title><link rel="stylesheet" href="../style.css"><style>.report-container { max-width: 800px; margin: 1.5rem auto; background: var(--bg-light); border-radius: 6px; border: 1px solid var(--border); overflow: hidden; }.report-header { background: var(--bg); color: var(--text); padding: 2rem 1.5rem; text-align: center; border-bottom: 1px solid var(--border); }.report-header h1 { font-size: 2rem; margin-bottom: 0.3rem; font-weight: 700; color: var(--primary); }.report-header p { font-size: 1rem; color: var(--text-muted); }.report-timestamp { font-size: 0.85rem; margin-top: 0.5rem; color: var(--text-muted); }.report-content { padding: 1.5rem; line-height: 1.6; }.report-content p { font-size: 0.9rem; margin-bottom: 0.8rem; color: var(--text); }.report-content h1 { font-size: 1.8rem; color: var(--primary); margin-top: 1.5rem; margin-bottom: 0.8rem; border-left: 3px solid var(--primary); padding-left: 0.8rem; }.report-content h2 { font-size: 1.6rem; color: var(--primary); margin-top: 1.5rem; margin-bottom: 0.8rem; border-left: 3px solid var(--primary); padding-left: 0.8rem; }.report-content h3 { font-size: 1.3rem; color: var(--secondary); margin-top: 1rem; margin-bottom: 0.5rem; }.report-content h4 { font-size: 1.1rem; color: var(--secondary); margin-top: 0.8rem; margin-bottom: 0.4rem; }.report-content ul { margin-left: 1.5rem; margin-bottom: 0.8rem; }.report-content li { font-size: 0.9rem; margin-bottom: 0.3rem; color: var(--text); }.report-content code { background: var(--bg); padding: 0.15rem 0.4rem; border-radius: 3px; font-family: monospace; color: var(--secondary); font-size: 0.85em; }.report-content pre { background: var(--bg-dark); color: var(--text); padding: 1rem; border-radius: 4px; overflow-x: auto; margin: 0.8rem 0; font-family: monospace; font-size: 0.8rem; border: 1px solid var(--border); }.report-footer { background: var(--bg); padding: 1rem; text-align: center; color: var(--text-muted); border-top: 1px solid var(--border); font-size: 0.9rem; }.report-footer a { color: var(--primary); text-decoration: none; }.report-footer a:hover { color: var(--secondary); }</style></head><body><div class="report-container"><div class="report-header"><h1>🔍 Code Review</h1><p>Gemini Analysis</p><p class="report-timestamp">' + date.toUTCString() + '</p></div><div class="report-content">' + markdownToHtml(report) + '</div><div class="report-footer"><p><a href="index.html">← Back to Reports</a></p></div></div></body></html>';

            if (!fs.existsSync("reports")) {
              fs.mkdirSync("reports", { recursive: true });
            }

            fs.writeFileSync("reports/" + reportName, html);

            let indexPath = "reports/index.html";
            let index = "";

            if (fs.existsSync(indexPath)) {
              index = fs.readFileSync(indexPath, "utf8");
            } else {
              index = '<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Code Reviews</title><link rel="stylesheet" href="../style.css"><style>.reviews-container { max-width: 900px; margin: 1.5rem auto; padding: 0 1rem; }.reviews-header { text-align: center; margin-bottom: 2rem; }.reviews-header h1 { font-size: 2rem; color: var(--primary); margin-bottom: 0.3rem; }.reviews-header p { color: var(--text-muted); font-size: 0.95rem; }.reviews-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }.review-card { background: var(--bg-light); border: 1px solid var(--border); border-radius: 6px; padding: 1.2rem; text-decoration: none; color: inherit; display: flex; flex-direction: column; transition: all 0.3s ease; }.review-card:hover { border-color: var(--primary); background: var(--bg); }.review-card h3 { color: var(--primary); margin-bottom: 0.3rem; font-size: 1rem; }.review-card .date { color: var(--text-muted); font-size: 0.8rem; }@media (max-width: 768px) { .reviews-header h1 { font-size: 1.5rem; }.reviews-grid { grid-template-columns: 1fr; }}</style></head><body><div class="reviews-container"><div class="reviews-header"><h1>Code Reviews</h1><p>Gemini-powered analysis reports</p></div><div class="reviews-grid" id="reviews"></div></div></body></html>';
            }

            const files = fs.readdirSync("reports").filter(f => f.startsWith("report-") && f.endsWith(".html")).sort().reverse();

            let cardsHtml = "";
            files.forEach(file => {
              const timeStr = file.replace("report-", "").replace(".html", "");
              const parts = timeStr.split("T");
              const dateParts = parts[0].split("-");
              const timeParts = parts[1].split("-");
              const year = dateParts[0];
              const month = dateParts[1];
              const day = dateParts[2];
              const hour = timeParts[0];
              const min = timeParts[1];
              const sec = timeParts[2];
              const displayName = day + "/" + month + "/" + year + " " + hour + ":" + min + ":" + sec;
              cardsHtml += '<a href="./' + file + '" class="review-card"><h3>📝 Review</h3><p class="date">' + displayName + '</p></a>';
            });

            index = index.replace('<div class="reviews-grid" id="reviews"></div>', '<div class="reviews-grid">' + cardsHtml + '</div>');
            fs.writeFileSync(indexPath, index);

            console.log("=== Gemini Code Review Complete ===");
            console.log(report);
          })();
          EOF

      - name: Commit and push reports
        env:
          GH_PAGES_PAT: ${{ secrets.GH_PAGES_PAT }}
        run: |
          git config user.name "gemini-bot"
          git config user.email "gemini@actions"
          git add reports/
          git commit -m "Add Gemini code report" || echo "No changes to commit"
          mkdir -p /tmp/pages-repo
          cd /tmp/pages-repo
          git clone https://x-access-token:${GH_PAGES_PAT}@github.com/Mod-Sauce/mod-sauce.github.io.git .
          cp -r $GITHUB_WORKSPACE/reports .
          git config user.name "gemini-bot"
          git config user.email "gemini@actions"
          git add reports/
          git commit -m "Add Gemini code report" || echo "No changes to commit"
          git push origin main