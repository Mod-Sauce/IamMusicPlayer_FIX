name: Gemini Code Report

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  gemini-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install @google/generative-ai simple-git

      - name: Run Gemini analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node <<'EOF'
          (async () => {
            const { GoogleGenerativeAI } = await import("@google/generative-ai");
            const simpleGit = (await import("simple-git")).default;
            const fs = await import("fs");

            const git = simpleGit();
            const diff = await git.diff(["HEAD~1"]);

            const genAI = new GoogleGenerativeAI(process.env.GEMINI_API_KEY);
            const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash" });

            const prompt = `You are a code review expert. Analyze the following git diff and provide a detailed code review.

            Focus on:
            - Potential bugs or logical errors in the NEW code
            - Performance issues and optimization opportunities
            - Security vulnerabilities
            - Code style and maintainability improvements
            - Edge cases that might not be handled
            - If the old code had a better approach to solving the same problem, mention it

            Be constructive and specific. For each issue, explain:
              1. What the problem is
              2. Why it matters
              3. How to fix it with concrete code examples

            Return the review in clean, well-formatted markdown with sections and code blocks.

            Git Diff:
            \`\`\`diff
            ${diff}
            \`\`\``;

            const result = await model.generateContent(prompt);
            const report = result.response.text();

            const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
            const reportName = `report-${timestamp}.html`;
            const date = new Date();

            const html = `<!DOCTYPE html>
            <html lang="en" data-theme="dark">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Gemini Code Review</title>
              <link rel="stylesheet" href="/style.css">
              <style>
                .container { 
                  max-width: 900px; 
                  margin: 2rem auto; 
                  background: var(--bg-light); 
                  border-radius: 8px; 
                  border: 1px solid var(--border);
                  overflow: hidden; 
                }
                .header { 
                  background: var(--bg); 
                  color: var(--text); 
                  padding: 3rem 2rem; 
                  text-align: center; 
                  border-bottom: 1px solid var(--border);
                }
                .header h1 { 
                  font-size: 2.5rem; 
                  margin-bottom: 0.5rem; 
                  font-weight: 700;
                  color: var(--primary);
                }
                .header p { 
                  font-size: 1rem; 
                  color: var(--text-muted);
                }
                .timestamp { 
                  font-size: 0.85rem; 
                  margin-top: 1rem; 
                  color: var(--text-muted);
                }
                .content { 
                  padding: 2.5rem; 
                }
                .content h2 { 
                  color: var(--primary); 
                  margin-top: 2rem; 
                  margin-bottom: 1rem; 
                  font-size: 1.5rem; 
                  border-left: 3px solid var(--primary); 
                  padding-left: 1rem;
                }
                .content h3 { 
                  color: var(--secondary); 
                  margin-top: 1.5rem; 
                  margin-bottom: 0.8rem; 
                  font-size: 1.2rem; 
                }
                .content h4 {
                  color: var(--text-muted);
                  margin-top: 1rem;
                  margin-bottom: 0.5rem;
                  font-size: 1rem;
                }
                .content p { 
                  margin-bottom: 1rem; 
                  color: var(--text);
                }
                .content ul, .content ol { 
                  margin-left: 2rem; 
                  margin-bottom: 1rem; 
                }
                .content li {
                  margin-bottom: 0.5rem;
                  color: var(--text);
                }
                .content code { 
                  background: var(--bg); 
                  padding: 0.2rem 0.5rem; 
                  border-radius: 4px; 
                  font-family: 'Courier New', monospace; 
                  color: var(--secondary);
                  font-size: 0.9em;
                }
                .content pre { 
                  background: var(--bg-dark); 
                  color: var(--text); 
                  padding: 1.5rem; 
                  border-radius: 6px; 
                  overflow-x: auto; 
                  margin: 1rem 0; 
                  font-family: 'Courier New', monospace; 
                  font-size: 0.85rem;
                  border: 1px solid var(--border);
                }
                .content pre code { 
                  background: none; 
                  padding: 0; 
                  color: inherit; 
                }
                .footer { 
                  background: var(--bg); 
                  padding: 1.5rem; 
                  text-align: center; 
                  color: var(--text-muted); 
                  border-top: 1px solid var(--border);
                  font-size: 0.9rem;
                }
                .footer a { 
                  color: var(--primary); 
                  text-decoration: none; 
                }
                .footer a:hover { 
                  color: var(--secondary);
                }
                @media (max-width: 768px) { 
                  .header h1 { font-size: 1.8rem; }
                  .content { padding: 1.5rem; }
                }
              </style>
            </head>
            <body>
              <div class="container">
                <div class="header">
                  <h1>🔍 Code Review</h1>
                  <p>Gemini Analysis Report</p>
                  <p class="timestamp">${date.toUTCString()}</p>
                </div>
                <div class="content">
                  ${report}
                </div>
                <div class="footer">
                  <p><a href="index.html">← Back to Reports</a></p>
                </div>
              </div>
            </body>
            </html>`;

            fs.writeFileSync(reportName, html);

            let index = "";
            let reportsHTML = "";
            
            if (fs.existsSync("report.html")) {
              index = fs.readFileSync("report.html", "utf8");
            } else {
              index = `<!DOCTYPE html>
              <html lang="en" data-theme="dark">
              <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Code Reviews</title>
                <link rel="stylesheet" href="/style.css">
                <style>
                  .reports-container {
                    max-width: 1200px;
                    margin: 2rem auto;
                    padding: 0 2rem;
                  }
                  .reports-header {
                    text-align: center;
                    margin-bottom: 3rem;
                  }
                  .reports-header h1 {
                    font-size: 2.5rem;
                    color: var(--primary);
                    margin-bottom: 0.5rem;
                  }
                  .reports-header p {
                    color: var(--text-muted);
                    font-size: 1rem;
                  }
                  .reports-grid {
                    display: grid;
                    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                    gap: 1.5rem;
                  }
                  .report-card {
                    background: var(--bg-light);
                    border: 1px solid var(--border);
                    border-radius: 8px;
                    padding: 1.5rem;
                    text-decoration: none;
                    color: inherit;
                    display: flex;
                    flex-direction: column;
                    transition: all 0.3s ease;
                  }
                  .report-card:hover {
                    border-color: var(--primary);
                    background: var(--bg);
                  }
                  .report-card h2 {
                    color: var(--primary);
                    margin-bottom: 0.5rem;
                    font-size: 1.2rem;
                  }
                  .report-card .date {
                    color: var(--text-muted);
                    font-size: 0.85rem;
                  }
                  @media (max-width: 768px) {
                    .reports-header h1 { font-size: 1.8rem; }
                    .reports-grid {
                      grid-template-columns: 1fr;
                    }
                  }
                </style>
              </head>
              <body>
                <div class="reports-container">
                  <div class="reports-header">
                    <h1>Code Reviews</h1>
                    <p>Gemini-powered analysis reports</p>
                  </div>
                  <div class="reports-grid" id="reports"></div>
                </div>
              </body>
              </html>`;
            }

            const button = `<a href="./${reportName}" class="report-card"><h2>📝 Report</h2><p class="date">${date.toUTCString()}</p></a>`;
            index = index.replace('<div class="reports-grid" id="reports">', `<div class="reports-grid" id="reports">\n                  ${button}`);
            fs.writeFileSync("report.html", index);

            console.log("=== Gemini Code Review Complete ===");
            console.log(report);
          })();
          EOF

      - name: Commit and push reports
        env:
          GH_PAGES_PAT: ${{ secrets.GH_PAGES_PAT }}
        run: |
          git config user.name "gemini-bot"
          git config user.email "gemini@actions"
          git add report*.html report.html
          git commit -m "Add Gemini code report" || echo "No changes to commit"
          mkdir -p /tmp/pages-repo
          cd /tmp/pages-repo
          git clone https://x-access-token:${GH_PAGES_PAT}@github.com/Mod-Sauce/mod-sauce.github.io.git .
          cp -r $GITHUB_WORKSPACE/report*.html .
          cp $GITHUB_WORKSPACE/report.html .
          git config user.name "gemini-bot"
          git config user.email "gemini@actions"
          git add report*.html report.html
          git commit -m "Add Gemini code report" || echo "No changes to commit"
          git push origin main