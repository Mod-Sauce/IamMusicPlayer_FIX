architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/iammusicplayer.accesswidener")
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    modApi "dev.architectury:architectury:${rootProject.architectury_version}"

    def localJar = file("../../OtyacraftEngineRenewed/common/build/libs/otyacraftenginerenewed-${rootProject.oe_version}.jar")
    if (localJar.exists()) {
        modApi files(localJar)
    } else {
        modApi "org.mod-sauce:otyacraftenginerenewed:${rootProject.oe_version}"
    }

    modApi "me.shedaniel.cloth:cloth-config:${rootProject.cloth_config_version}"

    implementation "dev.felnull:felnull-java-library:${rootProject.felnull_version}"

    implementation("dev.arbjerg:lavaplayer:${rootProject.lava_version_youtube}")
    implementation("dev.lavalink.youtube:v2:${rootProject.lavalink}")

    implementation "com.github.sealedtx:java-youtube-downloader:${rootProject.ytdownloader}"
    implementation 'com.mpatric:mp3agic:0.9.1'

    compileOnly("cc.tweaked:cc-tweaked-${rootProject.minecraft_version}-common-api:${rootProject.cct_version}")

    api "dev.ryanhcode.sable-companion:sable-companion-common-${project.minecraft_version}:${project.sable_companion_version}"

    modCompileOnly "maven.modrinth:jade:${rootProject.jade_version}"

    implementation("com.google.zxing:core:3.5.3")
}
// Android binaries are built separately with the NDK, never downloaded at game startup.
def androidNativesDir = rootProject.file(rootProject.findProperty('androidNativesDir')
    ?: 'native-resources/android/resources')
sourceSets.main.resources.srcDir(androidNativesDir)

processResources {
    from(rootProject.file('LICENSE')) { into 'META-INF/imp-licenses' }
    from(rootProject.files('THIRD_PARTY_NOTICES.md', 'RELEASING.md')) { into 'META-INF/imp-licenses' }
    from(rootProject.file('licenses')) { into 'META-INF/imp-licenses/licenses' }
    from(rootProject.file('scripts/android-natives/LICENSE')) {
        into 'META-INF/imp-licenses'
        rename { 'android-tooling-APACHE-2.0.txt' }
    }
    inputs.property('requireAndroidNatives', rootProject.findProperty('withAndroidNatives') ?: 'false')
    inputs.property('androidLavaplayerVersion', rootProject.lava_version_youtube)
    doFirst {
        boolean required = rootProject.findProperty('withAndroidNatives') == 'true'
            || rootProject.hasProperty('androidNativesDir')
        if (required || androidNativesDir.exists()) {
            if (rootProject.lava_version_youtube != '2.2.4') {
                throw new GradleException('Re-audit Android JNI compatibility before changing LavaPlayer 2.2.4.')
            }
            ['android-aarch64', 'android-armhf', 'android-x86', 'android-x86-64'].each { target ->
                ["natives/${target}/libconnector.so", "META-INF/android-natives/${target}/provenance.json"].each { resource ->
                    if (!new File(androidNativesDir, resource).isFile()) {
                        throw new GradleException("Missing Android native resource: ${resource}. See scripts/android-natives/README.md.")
                    }
                }
            }
        } else {
            logger.lifecycle('Building without Android natives. See scripts/android-natives/README.md to enable Pojav support.')
        }
    }
}

sourceSets {
    androidNativeTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
tasks.register('androidNativeSupportTest', JavaExec) {
    dependsOn androidNativeTestClasses
    classpath = sourceSets.androidNativeTest.runtimeClasspath
    mainClass = 'dev.felnull.imp.client.lava.AndroidNativeSupportTest'
}
tasks.named('check') {
    dependsOn tasks.named('androidNativeSupportTest')
}

