name: Mod Build
on:
  - workflow_dispatch

jobs:
  build:
    runs-on: codeberg-small
    steps:
      - name: Checkout Repository
        uses: actions/checkout@main
        with:
          fetch-depth: 1
      - name: Build
        run: ./gradlew clean build
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          path: |
            fabric/build/libs
            forge/build/libs
          retention-days: 30
          archive: false
