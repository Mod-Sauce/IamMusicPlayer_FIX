name: Bug Report (Codeberg)
description: Something is not working right
title: "[Bug]: "
labels: ["bug"]
assignees:
  - Fr4gm3nt3d_sh
  - Shadowbee

body:
  - type: checkboxes
    attributes:
      label: Already reported ? *
      description: Before opening a new bug report, please take a moment to search through the current open and closed issues to check if it already exists.
      options:
        - label: I have searched the existing open and closed issues.
          required: true

  - type: dropdown
    id: type
    attributes:
      label: Regression?
      description: "Regression means that something used to work but no longer does."
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true

  - type: dropdown
    id: modversion
    attributes:
      label: Mod Version
      description: "The version of the Mod youre using."
      options:
        - "3.22.0-alpha.7"
        - "3.22.0-alpha.6"
        - "3.22.0-alpha.5"
        - "3.23"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: modloader
    attributes:
      label: Mod Loader
      options:
        - "Forge"
        - "Neo Forge"
        - "Fabric"
        - "Quilt"
    validations:
      required: true

  - type: textarea
    id: desc
    attributes:
      label: Description
      description: "What went wrong? What exactly happened?"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to Reproduce
      description: "How can someone else reproduce the issue?"
    validations:
      required: true

  - type: textarea
    id: other
    attributes:
      label: Logs (pls use https://mclo.gs/), Images or Videos and the other Mods you added
      description: "Anything that can help. If you are using an existing Modpack you can provide the Link to it."
